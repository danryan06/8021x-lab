<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>802.1X Lab</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("dot1x_theme");
          const theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (_) {
          /* ignore */
        }
      })();
    </script>
    <!-- Fonts are self-hosted via @fontsource (imported in src/main.tsx) so the
         UI works on isolated lab networks without internet access. -->
  </head>
  <body class="bg-mist text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
