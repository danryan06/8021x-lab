name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend with dev extras
        run: pip install -e "./backend[dev]"
      - name: Lint (ruff)
        run: ruff check backend
      - name: Tests (pytest)
        working-directory: backend
        run: pytest -v

  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check and build
        run: npm run build

  infra:
    name: Infra (shell syntax + compose config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell script syntax
        run: |
          set -e
          for f in scripts/*.sh services/freeradius/docker-entrypoint.sh \
                   services/freeradius/scripts/*.sh backend/docker-entrypoint.sh; do
            bash -n "$f"
            echo "OK: $f"
          done
      - name: Validate docker compose config
        # No .env on CI — the compose file must work without one (env_file is optional).
        run: docker compose config --quiet
