services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dot1x}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dot1x_lab_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-dot1x_lab}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dot1x} -d ${POSTGRES_DB:-dot1x_lab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dot1x:dot1x_lab_change_me@db:5432/dot1x_lab}
      FREERADIUS_CONFIG_DIR: /var/lib/dot1x-lab/freeradius
      FREERADIUS_AUTH_LOG_PATH: /var/lib/dot1x-lab/freeradius/logs/auth.log
      FREERADIUS_RELOAD_COMMAND: ${FREERADIUS_RELOAD_COMMAND:-echo "reload-requested"}
      FREERADIUS_HOST: freeradius
      FREERADIUS_AUTH_PORT: "1812"
      FREERADIUS_LAB_SECRET: ${FREERADIUS_LAB_SECRET:-testing123}
      FREERADIUS_CA_PATH: /var/lib/dot1x-lab/freeradius/certs/ca.pem
      RADIUS_ADVERTISE_IP: ${RADIUS_ADVERTISE_IP:-}
      RADIUS_ADVERTISE_AUTH_PORT: ${RADIUS_ADVERTISE_AUTH_PORT:-1812}
      RADIUS_ADVERTISE_ACCT_PORT: ${RADIUS_ADVERTISE_ACCT_PORT:-1813}
      RADIUS_HOST_IP_FILE: /var/lib/dot1x-lab/freeradius/host-ip
      CA_DATA_DIR: /var/lib/dot1x-lab/ca
    ports:
      - "8000:8000"
    volumes:
      - freeradius_runtime:/var/lib/dot1x-lab/freeradius
      - ca_data:/var/lib/dot1x-lab/ca
      - ./services/freeradius/templates:/app/services/freeradius/templates:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Use a short TCP probe so a slow DB does not mark the API process unhealthy.
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  freeradius:
    build:
      context: ./services/freeradius
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-dot1x}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dot1x_lab_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-dot1x_lab}
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      - freeradius_runtime:/etc/freeradius/dot1x-lab
      - ./services/freeradius/templates:/etc/freeradius/dot1x-lab-templates:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x freeradius >/dev/null || pgrep -f freeradius >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

volumes:
  pgdata:
  freeradius_runtime:
  ca_data:
